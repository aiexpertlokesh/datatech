<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Under Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0f0f0f;
      --surface: #1a1a1a;
      --gold: #d4a574;
      --gold-glow: rgba(212, 165, 116, 0.4);
      --gold-border: rgba(212, 165, 116, 0.15);
      --cream: #f5f0eb;
      --text-primary: #e8e4e0;
      --text-secondary: #a0998f;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background with noise and pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(212, 165, 116, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(212, 165, 116, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 60% 80%, rgba(212, 165, 116, 0.02) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* Noise texture overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    /* Floating geometric shapes */
    .bg-shape {
      position: fixed;
      border: 1px solid var(--gold-border);
      border-radius: 50%;
      opacity: 0.3;
      pointer-events: none;
      animation: float 20s ease-in-out infinite;
    }

    .bg-shape:nth-child(1) {
      width: 300px;
      height: 300px;
      top: 10%;
      left: -100px;
      animation-delay: 0s;
    }

    .bg-shape:nth-child(2) {
      width: 200px;
      height: 200px;
      bottom: 15%;
      right: -50px;
      animation-delay: -5s;
    }

    .bg-shape:nth-child(3) {
      width: 150px;
      height: 150px;
      top: 60%;
      left: 10%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    /* Logo */
    .logo {
      position: fixed;
      top: 32px;
      left: 32px;
      z-index: 100;
      opacity: 0;
      animation: fadeInDown 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    .logo img {
      max-width: 300px;
      max-height: 120px;
      height: auto;
      display: block;
    }

    /* Main content */
    .main-content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 48px;
    }

    .content-wrapper {
      max-width: 560px;
      text-align: center;
    }

    /* Main heading */
    .heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      line-height: 1.2;
      color: var(--cream);
      margin-bottom: 24px;
      text-shadow: 0 0 60px var(--gold-glow);
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.5s;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 480px;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.7s;
    }

    /* CTA Button */
    .cta-btn {
      display: inline-block;
      padding: 16px 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--bg-dark);
      background: var(--gold);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(212, 165, 116, 0.3);
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.9s;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 165, 116, 0.4);
    }

    .cta-btn:active {
      transform: scale(0.98);
    }

    /* Email signup form */
    .signup-form {
      margin-top: 48px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 1.1s;
    }

    .form-wrapper {
      display: flex;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .email-input {
      flex: 1;
      min-width: 200px;
      padding: 14px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--gold-border);
      border-radius: 4px;
      outline: none;
      transition: all 0.3s ease;
    }

    .email-input::placeholder {
      color: var(--text-secondary);
    }

    .email-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.15);
    }

    .submit-btn {
      padding: 14px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .form-message {
      margin-top: 16px;
      font-size: 0.9rem;
      min-height: 24px;
    }

    .form-message.success {
      color: #7cb98a;
    }

    .form-message.error {
      color: #e07a5f;
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 1.3s;
      z-index: 10;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 640px) {
      .logo {
        top: 24px;
        left: 24px;
      }

      .logo img {
        max-width: 100px;
      }

      .main-content {
        padding: 100px 20px 60px;
      }

      .form-wrapper {
        flex-direction: column;
      }

      .email-input {
        min-width: 100%;
      }

      .submit-btn {
        width: 100%;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .logo {
        top: 28px;
        left: 28px;
      }
    }
  </style>
</head>
<body>
  <!-- Background shapes -->
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>
  <div class="bg-shape"></div>

  <!-- Logo -->
  <div class="logo">
    <a href="/">
      <img src="logo.png" alt="Logo">
    </a>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-wrapper">
      <h1 class="heading">Site is Under Maintenance</h1>
      <p class="tagline">We're crafting an experience worth the wait. Stay tuned for something extraordinary.</p>

      <a href="#signup" class="cta-btn">Get Notified</a>

      <!-- Email Signup Form -->
      <div class="signup-form" id="signup">
        <form class="form-wrapper" id="emailForm">
          <input
            type="email"
            class="email-input"
            placeholder="Enter your email"
            required
            id="emailInput"
          >
          <button type="submit" class="submit-btn">Subscribe</button>
        </form>
        <p class="form-message" id="formMessage"></p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026. All rights reserved.</p>
  </footer>

  <script>
    // Email form handling
    const form = document.getElementById('emailForm');
    const emailInput = document.getElementById('emailInput');
    const formMessage = document.getElementById('formMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const email = emailInput.value.trim();

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email) {
        formMessage.textContent = 'Please enter your email address.';
        formMessage.className = 'form-message error';
        return;
      }

      if (!emailRegex.test(email)) {
        formMessage.textContent = 'Please enter a valid email address.';
        formMessage.className = 'form-message error';
        return;
      }

      // Success state (in production, you'd send to a backend)
      formMessage.textContent = 'Thanks! We\'ll be in touch.';
      formMessage.className = 'form-message success';
      emailInput.value = '';

      // Clear message after 5 seconds
      setTimeout(() => {
        formMessage.textContent = '';
        formMessage.className = 'form-message';
      }, 5000);
    });
  </script>
</body>
</html>
